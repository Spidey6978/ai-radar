  - id: gnews_anomalies
    name: "Google News: Autonomous Anomalies & Drift"
    track: curated_news
    layer: discovery
    access: feed
    endpoint: "https://news.google.com/rss/search?q=(%22autonomous+agent%22+OR+%22AI+satellite%22)+AND+(anomaly+OR+drift+OR+takeover)&hl=en-US&gl=US&ceid=US:en"
    poll_interval_minutes: 90
    is_snapshot: false
    relevance_gate: anti_sludge_strict
    evidence_tier: secondary_press
